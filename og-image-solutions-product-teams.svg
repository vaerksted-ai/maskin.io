  <text x="80" y="374" font-family="'Schibsted Grotesk'" font-size="54" font-weight="600" fill="#ECEAE4" letter-spacing="-0.018em"><tspan fill="#3B74F2">bets</tspan>, not backlogs.</text>

  <text x="80" y="452" font-family="'Newsreader'" font-style="italic" font-size="27" fill="#A09A93">The AI-native product workspace &#8212;</text>

  <g transform="translate(740 172)">

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Composable AI agents vs AI employees</title>
  <desc id="d">Left: an org chart of persona boxes, the AI-employees camp. Right: a graph of typed objects with small agents firing on state changes, the composable camp.</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Warm-dark canvas + subtle grid -->
  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- ============================================================ -->
  <!-- LEFT: AI employees — a synthetic org chart of personas        -->
  <!-- ============================================================ -->
  <g id="employees">
    <text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#5A5751">CAMP 1</text>
    <text x="80" y="128" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FAFAF8">AI employees</text>

    <!-- org-chart connectors -->
    <path d="M 330 218 L 330 262 M 330 262 L 160 262 L 160 306 M 330 262 L 500 262 L 500 306 M 330 262 L 330 306" fill="none" stroke="#3A3835" stroke-width="2" stroke-dasharray="6 5"/>

    <!-- manager persona -->
    <rect x="250" y="168" width="160" height="50" rx="10" fill="#1E1C18" stroke="#3A3835" stroke-width="1.5"/>
    <circle cx="276" cy="193" r="10" fill="#2A2825"/>
    <rect x="296" y="185" width="90" height="10" rx="5" fill="#5A5751"/>
    <rect x="296" y="201" width="60" height="8" rx="4" fill="#3A3835"/>

    <!-- worker personas -->
    <rect x="80" y="306" width="160" height="50" rx="10" fill="#1E1C18" stroke="#3A3835" stroke-width="1.5"/>
    <circle cx="106" cy="331" r="10" fill="#2A2825"/>
    <rect x="126" y="323" width="90" height="10" rx="5" fill="#5A5751"/>
    <rect x="126" y="339" width="55" height="8" rx="4" fill="#3A3835"/>

    <rect x="250" y="306" width="160" height="50" rx="10" fill="#1E1C18" stroke="#3A3835" stroke-width="1.5"/>
    <circle cx="276" cy="331" r="10" fill="#2A2825"/>
    <rect x="296" y="323" width="80" height="10" rx="5" fill="#5A5751"/>
    <rect x="296" y="339" width="62" height="8" rx="4" fill="#3A3835"/>

    <rect x="420" y="306" width="160" height="50" rx="10" fill="#1E1C18" stroke="#3A3835" stroke-width="1.5"/>
    <circle cx="446" cy="331" r="10" fill="#2A2825"/>
    <rect x="466" y="323" width="86" height="10" rx="5" fill="#5A5751"/>
    <rect x="466" y="339" width="50" height="8" rx="4" fill="#3A3835"/>

    <!-- chat-log audit trail -->
    <rect x="80" y="394" width="500" height="72" rx="10" fill="#141311" stroke="#2A2825" stroke-width="1.2"/>
    <rect x="100" y="410" width="300" height="9" rx="4.5" fill="#26241F"/>
    <rect x="100" y="428" width="380" height="9" rx="4.5" fill="#221F1B"/>
    <rect x="100" y="446" width="220" height="9" rx="4.5" fill="#1E1C18"/>

    <text x="80" y="504" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A867E">The persona is the primitive.</text>
    <text x="80" y="532" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A867E">Audit trail: a chat log.</text>
  </g>

  <!-- divider -->
  <line x1="600" y1="80" x2="600" y2="550" stroke="#2A2825" stroke-width="1.5"/>
  <circle cx="600" cy="315" r="26" fill="#111110" stroke="#2A2825" stroke-width="1.5"/>
  <text x="600" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8A867E">vs</text>

  <!-- ============================================================ -->
  <!-- RIGHT: composable agents — typed objects + event-driven agents -->
  <!-- ============================================================ -->
  <g id="composable">
    <text x="640" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#2563EB">CAMP 2</text>
    <text x="640" y="128" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#FAFAF8">Composable agents</text>

    <!-- typed relationships -->
    <path d="M 700 262 L 820 262" stroke="#2563EB" stroke-width="2.5" fill="none"/>
    <path d="M 900 262 L 1020 262" stroke="#2563EB" stroke-width="2.5" fill="none"/>
    <path d="M 1060 292 L 1060 340 L 900 340 L 780 340 L 780 292" stroke="#2563EB" stroke-width="2.5" fill="none" opacity="0.55"/>
    <path d="M 812 256 l 8 6 l -8 6 M 1012 256 l 8 6 l -8 6" stroke="#2563EB" stroke-width="2.5" fill="none"/>

    <!-- typed objects: insight, bet, task -->
    <rect x="640" y="222" width="120" height="80" rx="12" fill="#14130F" stroke="#2563EB" stroke-width="2"/>
    <circle cx="662" cy="244" r="6" fill="#2563EB"/>
    <rect x="676" y="239" width="64" height="10" rx="5" fill="#FAFAF8" opacity="0.85"/>
    <rect x="658" y="264" width="84" height="8" rx="4" fill="#3A3835"/>
    <rect x="658" y="280" width="56" height="8" rx="4" fill="#3A3835"/>

    <rect x="840" y="222" width="120" height="80" rx="12" fill="#14130F" stroke="#2563EB" stroke-width="2"/>
    <circle cx="862" cy="244" r="6" fill="#2563EB"/>
    <rect x="876" y="239" width="50" height="10" rx="5" fill="#FAFAF8" opacity="0.85"/>
    <rect x="858" y="264" width="84" height="8" rx="4" fill="#3A3835"/>
    <rect x="858" y="280" width="64" height="8" rx="4" fill="#3A3835"/>

    <rect x="1000" y="222" width="120" height="80" rx="12" fill="#14130F" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1022" cy="244" r="6" fill="#2563EB"/>
    <rect x="1036" y="239" width="56" height="10" rx="5" fill="#FAFAF8" opacity="0.85"/>
    <rect x="1018" y="264" width="84" height="8" rx="4" fill="#3A3835"/>
    <rect x="1018" y="280" width="48" height="8" rx="4" fill="#3A3835"/>

    <!-- small agents firing on state changes (event-driven, scoped) -->
    <circle cx="790" cy="262" r="12" fill="#2563EB"/>
    <path d="M 786 262 l 3 4 l 7 -8" stroke="#FAFAF8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="990" cy="262" r="12" fill="#2563EB"/>
    <path d="M 986 262 l 3 4 l 7 -8" stroke="#FAFAF8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- human gate -->
    <rect x="780" y="372" width="140" height="44" rx="22" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="850" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FAFAF8">human gate</text>
    <path d="M 850 340 L 850 372" stroke="#2563EB" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

    <!-- event-sourced trail -->
    <rect x="640" y="436" width="480" height="30" rx="8" fill="#14130F" stroke="#2A2825" stroke-width="1.2"/>
    <circle cx="660" cy="451" r="4" fill="#2563EB"/><circle cx="700" cy="451" r="4" fill="#2563EB"/><circle cx="740" cy="451" r="4" fill="#2563EB"/>
    <circle cx="780" cy="451" r="4" fill="#2563EB"/><circle cx="820" cy="451" r="4" fill="#2563EB"/><circle cx="860" cy="451" r="4" fill="#3A3835"/>
    <circle cx="900" cy="451" r="4" fill="#3A3835"/><circle cx="940" cy="451" r="4" fill="#3A3835"/>

    <text x="640" y="504" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A867E">The typed object is the primitive.</text>
    <text x="640" y="532" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8A867E">Audit trail: event-sourced transitions.</text>
  </g>

  <!-- wordmark -->
  <text x="1120" y="590" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5A5751">MASKIN</text>
</svg>

  <rect width="1200" height="120" fill="url(#topFade)"/>
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="22" fill="#5A5751" letter-spacing="4">MCP TOOLS VS RESOURCES VS PROMPTS</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">Three primitives.</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">One question: who decides?</text>
  <text x="80" y="266" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" fill="#8B8781">Which one to expose, and what Maskin’s server does with each</text>
  <g id="panels"><rect x="80" y="320" width="330" height="200" rx="16" fill="#141311" stroke="#3A3835" stroke-width="1.4"/><text x="104" y="354" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#8B8781" letter-spacing="1.5">TOOL · THE MODEL DECIDES</text><circle cx="114" cy="388" r="3.4" fill="#5A5751"/><text x="132" y="393" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#B8B5AE">model calls it mid-task</text><circle cx="114" cy="423" r="3.4" fill="#5A5751"/><text x="132" y="428" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#B8B5AE">can change the world</text><circle cx="114" cy="458" r="3.4" fill="#5A5751"/><text x="132" y="463" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#B8B5AE">actions and lookups</text><rect x="427" y="312" width="346" height="216" rx="18" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.28"/><rect x="435" y="320" width="330" height="200" rx="16" fill="#131720" stroke="#2563EB" stroke-width="2"/><text x="459" y="354" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#2563EB" letter-spacing="1.5">RESOURCE · THE APP OR YOU</text><circle cx="469" cy="388" r="3.4" fill="#2563EB"/><text x="487" y="393" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#DCE6F7">URI you attach as context</text><circle cx="469" cy="423" r="3.4" fill="#2563EB"/><text x="487" y="428" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#DCE6F7">read-only</text><circle cx="469" cy="458" r="3.4" fill="#2563EB"/><text x="487" y="463" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#DCE6F7">@ mention, Add Context</text><rect x="790" y="320" width="330" height="200" rx="16" fill="#141311" stroke="#3A3835" stroke-width="1.4"/><text x="814" y="354" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#8B8781" letter-spacing="1.5">PROMPT · THE USER DECIDES</text><circle cx="824" cy="388" r="3.4" fill="#5A5751"/><text x="842" y="393" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#B8B5AE">named template + arguments</text><circle cx="824" cy="423" r="3.4" fill="#5A5751"/><text x="842" y="428" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#B8B5AE">a person launches it</text><circle cx="824" cy="458" r="3.4" fill="#5A5751"/><text x="842" y="463" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#B8B5AE">slash command</text></g>


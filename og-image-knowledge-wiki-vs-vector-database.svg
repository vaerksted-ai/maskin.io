<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f13" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d0f13" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d0f13"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#topFade)"/>
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="22" fill="#8a93a0" letter-spacing="4">KNOWLEDGE WIKI VS VECTOR DATABASE</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e8eaee">A compiled artifact is</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e8eaee">not a storage engine.</text>
  <text x="80" y="266" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" fill="#8a93a0">One is read as written; the other is ranked per query</text>
  <g id="panels">
    <rect x="80" y="320" width="470" height="200" rx="16" fill="#12151a" stroke="#373d47" stroke-width="1.4"/>
  <text x="104" y="354" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#8a93a0" letter-spacing="2">KNOWLEDGE WIKI</text>
    <circle cx="114" cy="388" r="3.4" fill="#5b6577"/>
    <text x="132" y="393" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8a93a0">compiled once</text>
    <circle cx="114" cy="418" r="3.4" fill="#5b6577"/>
    <text x="132" y="423" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8a93a0">human-edited</text>
    <circle cx="114" cy="448" r="3.4" fill="#5b6577"/>
    <text x="132" y="453" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8a93a0">read as written</text>
    <circle cx="114" cy="478" r="3.4" fill="#5b6577"/>
    <text x="132" y="483" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8a93a0">citable</text>
    <rect x="628" y="312" width="492" height="216" rx="18" fill="none" stroke="#6a8cff" stroke-width="1" opacity="0.28"/>
    <rect x="638" y="320" width="470" height="200" rx="16" fill="#12151a" stroke="#6a8cff" stroke-width="2"/>
  <text x="662" y="354" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#6a8cff" letter-spacing="2">VECTOR DATABASE</text>
    <circle cx="672" cy="388" r="3.4" fill="#6a8cff"/>
    <text x="690" y="393" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#e8edfb">embeddings</text>
    <circle cx="672" cy="418" r="3.4" fill="#6a8cff"/>
    <text x="690" y="423" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#e8edfb">nearest neighbours</text>
    <circle cx="672" cy="448" r="3.4" fill="#6a8cff"/>
    <text x="690" y="453" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#e8edfb">ranked per query</text>
    <circle cx="672" cy="478" r="3.4" fill="#6a8cff"/>
    <text x="690" y="483" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#e8edfb">stateless</text>
    <line x1="572" y1="410" x2="608" y2="430" stroke="#e8eaee" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="572" y1="430" x2="608" y2="410" stroke="#e8eaee" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="#12151a"/>
    <path d="M7 26 L7 9 L17 19 L27 9 L27 26" stroke="#e8eaee" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <text x="46" y="24" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#e8eaee">Maskin</text>
    <text x="46" y="46" font-family="JetBrains Mono, monospace" font-size="12" fill="#8a93a0">maskin.io/docs/knowledge-wiki-vs-vector-database</text>
  </g>
</svg>

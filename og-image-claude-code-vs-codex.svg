<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#111110" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#topFade)"/>
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="22" fill="#5A5751" letter-spacing="4">CLAUDE CODE VS CODEX</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">Pick by job.</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">Keep one record.</text>
  <text x="80" y="266" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" fill="#8B8781">Two coding agents, two instruction files, one shared place for decisions</text>

  <g id="diagram">
    <rect x="80" y="322" width="330" height="78" rx="14" fill="#141311" stroke="#3A3835" stroke-width="1.4"/>
    <text x="106" y="356" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#FAFAF8">Claude Code</text>
    <text x="106" y="384" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">CLAUDE.md</text>

    <rect x="80" y="424" width="330" height="78" rx="14" fill="#141311" stroke="#3A3835" stroke-width="1.4"/>
    <text x="106" y="458" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#FAFAF8">Codex</text>
    <text x="106" y="486" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">AGENTS.md</text>

    <path d="M410 361 C 520 361, 540 412, 640 412" fill="none" stroke="#2563EB" stroke-width="2.4"/>
    <path d="M410 463 C 520 463, 540 412, 640 412" fill="none" stroke="#2563EB" stroke-width="2.4"/>
    <path d="M628 404 L642 412 L628 420" fill="none" stroke="#2563EB" stroke-width="2.4"/>

    <rect x="650" y="322" width="470" height="180" rx="14" fill="#131720" stroke="#2563EB" stroke-width="2"/>
    <text x="680" y="364" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#7FA6EE" letter-spacing="2">THE RECORD</text>
    <text x="680" y="406" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#FAFAF8">owner</text>
    <text x="680" y="438" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#FAFAF8">decision + reason</text>
    <text x="680" y="470" font-family="JetBrains Mono, ui-monospace, monospace" font-size="18" fill="#FAFAF8">outcome condition</text>
  </g>

  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="#1C1B18"/>
    <path d="M7 26 L7 9 L17 19 L27 9 L27 26" stroke="#FAFAF8" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <text x="46" y="24" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">Maskin</text>
    <text x="46" y="46" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5751">maskin.io/docs/claude-code-vs-codex</text>
  </g>
</svg>

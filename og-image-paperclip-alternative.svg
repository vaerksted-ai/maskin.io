<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Warm-dark canvas + subtle grid -->
  <rect width="1200" height="630" fill="#0d0f13"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title band -->
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="22" fill="#8a93a0" letter-spacing="4">PAPERCLIP ALTERNATIVE</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e8eaee">When AI employees</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e8eaee">stop fitting.</text>
  <text x="80" y="266" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" fill="#8a93a0">Five shapes of alternative &#183; one honest comparison</text>

  <!-- Left side: org chart of AI employees -->
  <g transform="translate(80, 330)">
    <text x="0" y="0" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="14" fill="#8a93a0" letter-spacing="2">PAPERCLIP</text>
    <text x="0" y="22" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="14" fill="#8a93a0">goal &#8594; org chart &#8594; issues</text>

    <rect x="110" y="40" width="120" height="44" rx="8" fill="#12151a" stroke="#23272e" stroke-width="1.2"/>
    <text x="170" y="60" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" fill="#e8eaee">CEO agent</text>
    <text x="170" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a93a0">company goal</text>

    <path d="M 170 84 L 170 104 M 70 104 L 270 104 M 70 104 L 70 120 M 270 104 L 270 120" stroke="#5b6577" stroke-width="1.5" fill="none"/>

    <rect x="10" y="120" width="120" height="44" rx="8" fill="#12151a" stroke="#23272e" stroke-width="1.2"/>
    <text x="70" y="140" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" fill="#e8eaee">engineer</text>
    <text x="70" y="155" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a93a0">heartbeat</text>

    <rect x="210" y="120" width="120" height="44" rx="8" fill="#12151a" stroke="#23272e" stroke-width="1.2"/>
    <text x="270" y="140" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" fill="#e8eaee">marketer</text>
    <text x="270" y="155" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a93a0">heartbeat</text>

    <text x="10" y="196" font-family="Newsreader, Georgia, serif" font-size="14" font-style="italic" fill="#8a93a0">an org that does the work</text>
  </g>

  <!-- Right side: Maskin loop (typed objects with an owner) -->
  <g transform="translate(600, 330)">
    <text x="0" y="0" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="14" fill="#8a93a0" letter-spacing="2">MASKIN</text>
    <text x="0" y="22" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="14" fill="#e8eaee">insight &#8594; bet &#8594; task &#8594; outcome</text>

    <rect x="0" y="46" width="110" height="50" rx="8" fill="#12151a" stroke="#e8eaee" stroke-width="1.2"/>
    <text x="55" y="70" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" fill="#e8eaee">insight</text>
    <text x="55" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a93a0">signal in</text>

    <path d="M 116 71 L 148 71" stroke="#e8eaee" stroke-width="1.5"/>
    <path d="M 142 66 L 150 71 L 142 76" fill="none" stroke="#e8eaee" stroke-width="1.5" stroke-linejoin="miter"/>

    <rect x="156" y="46" width="110" height="50" rx="8" fill="#12151a" stroke="#e8eaee" stroke-width="1.2"/>
    <text x="211" y="70" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" fill="#e8eaee">bet</text>
    <text x="211" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a93a0">owner + win cond.</text>

    <path d="M 272 71 L 304 71" stroke="#e8eaee" stroke-width="1.5"/>
    <path d="M 298 66 L 306 71 L 298 76" fill="none" stroke="#e8eaee" stroke-width="1.5" stroke-linejoin="miter"/>

    <rect x="312" y="46" width="90" height="50" rx="8" fill="#12151a" stroke="#e8eaee" stroke-width="1.2"/>
    <text x="357" y="70" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" fill="#e8eaee">task</text>
    <text x="357" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#8a93a0">executes</text>

    <path d="M 408 71 L 440 71" stroke="#6a8cff" stroke-width="2"/>
    <path d="M 434 65 L 442 71 L 434 77" fill="none" stroke="#6a8cff" stroke-width="2" stroke-linejoin="miter"/>

    <rect x="448" y="42" width="120" height="58" rx="8" fill="#0d0f13" stroke="#6a8cff" stroke-width="2.5"/>
    <text x="508" y="66" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" font-weight="700" fill="#6a8cff">typed record</text>
    <text x="508" y="82" text-anchor="middle" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="13" font-weight="700" fill="#6a8cff">with an owner</text>
    <text x="508" y="96" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#6a8cff">outlives the agent</text>

    <text x="568" y="128" text-anchor="end" font-family="Newsreader, Georgia, serif" font-size="14" font-style="italic" fill="#e8eaee">the decision is the work</text>
  </g>

  <line x1="560" y1="340" x2="560" y2="530" stroke="#23272e" stroke-width="1" stroke-dasharray="3 6"/>

  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="#12151a"/>
    <path d="M7 26 L7 9 L17 19 L27 9 L27 26" stroke="#e8eaee" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <text x="46" y="24" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#e8eaee">Maskin</text>
    <text x="46" y="46" font-family="JetBrains Mono, monospace" font-size="12" fill="#8a93a0">maskin.io/alternatives/paperclip</text>
  </g>
</svg>

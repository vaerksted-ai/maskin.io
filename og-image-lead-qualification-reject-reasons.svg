<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#111110" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#topFade)"/>
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="22" fill="#5A5751" letter-spacing="4">LEAD QUALIFICATION DATA</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">207 rejected prospects.</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">84 for two reasons.</text>
  <text x="80" y="266" font-family="Newsreader, Liberation Serif, Georgia, serif" font-size="24" font-style="italic" fill="#8B8781">Agency (49) and too small (35), both checkable before enrichment</text>

  <g id="chart">
    <text x="80" y="326" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">Agency or services firm</text>
    <rect x="420" y="312" width="564" height="18" rx="3" fill="#2563EB"/>
    <text x="994" y="326" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">49</text>
    <text x="80" y="352" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">Too small</text>
    <rect x="420" y="338" width="403" height="18" rx="3" fill="#2563EB"/>
    <text x="833" y="352" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">35</text>
    <text x="80" y="378" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#8B8781">Too big or listed multinational</text>
    <rect x="420" y="364" width="299" height="18" rx="3" fill="#3A3835"/>
    <text x="729" y="378" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">26</text>
    <text x="80" y="404" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#8B8781">No verifiable company or role</text>
    <rect x="420" y="390" width="288" height="18" rx="3" fill="#3A3835"/>
    <text x="718" y="404" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">25</text>
    <text x="80" y="430" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#8B8781">Duplicate or already known</text>
    <rect x="420" y="416" width="253" height="18" rx="3" fill="#3A3835"/>
    <text x="683" y="430" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">22</text>
    <text x="80" y="456" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#8B8781">Wrong lane or role</text>
    <rect x="420" y="442" width="219" height="18" rx="3" fill="#3A3835"/>
    <text x="649" y="456" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">19</text>
    <text x="80" y="482" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#8B8781">No verifiable email</text>
    <rect x="420" y="468" width="173" height="18" rx="3" fill="#3A3835"/>
    <text x="603" y="482" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">15</text>
    <text x="80" y="508" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#8B8781">Competitor or agent platform</text>
    <rect x="420" y="494" width="161" height="18" rx="3" fill="#3A3835"/>
    <text x="591" y="508" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">14</text>
    <text x="80" y="534" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#8B8781">Wrong geography</text>
    <rect x="420" y="520" width="23" height="18" rx="3" fill="#3A3835"/>
    <text x="453" y="534" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#FAFAF8">2</text>
  </g>

  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="#1C1B18"/>
    <path d="M7 26 L7 9 L17 19 L27 9 L27 26" stroke="#FAFAF8" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <text x="46" y="24" font-family="Schibsted Grotesk, Inter, Liberation Sans, DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">Maskin</text>
    <text x="46" y="46" font-family="JetBrains Mono, Liberation Mono, DejaVu Sans Mono, monospace" font-size="12" fill="#5A5751">maskin.io/docs/lead-qualification-reject-reasons</text>
  </g>
</svg>

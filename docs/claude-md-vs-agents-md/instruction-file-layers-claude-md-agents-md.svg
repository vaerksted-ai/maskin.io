<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">Where each kind of agent rule belongs</title><desc id="d">Five layers: a shared home above the repo, a user-level file, CLAUDE.md, AGENTS.md in the repo, and a hook or permission setting.</desc><rect width="1200" height="630" fill="#FAFAF8"/><text x="60" y="60" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#111110">CLAUDE.md vs AGENTS.md: where each rule belongs</text><text x="60" y="88" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#4a4a45">Repo files cover one repo. The layers above and below cover everything else.</text><rect x="60" y="110" width="1080" height="82" rx="10" fill="#fff" stroke="#d8d6cf"/><rect x="60" y="110" width="10" height="82" rx="4" fill="#1f6f5c"/><text x="90" y="146" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111110">Shared home above the repo</text><text x="90" y="174" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#4a4a45">Rules true for every repo and every agent: a shared rules repo, or the agent system prompt and skills in a workspace</text><rect x="60" y="210" width="1080" height="82" rx="10" fill="#fff" stroke="#d8d6cf"/><rect x="60" y="210" width="10" height="82" rx="4" fill="#4a4a45"/><text x="90" y="246" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111110">User level</text><text x="90" y="274" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#4a4a45">Your personal preferences: ~/.claude/CLAUDE.md, CLAUDE.local.md</text><rect x="60" y="310" width="1080" height="82" rx="10" fill="#fff" stroke="#d8d6cf"/><rect x="60" y="310" width="10" height="82" rx="4" fill="#7a4b1e"/><text x="90" y="346" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111110">CLAUDE.md</text><text x="90" y="374" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#4a4a45">Claude-only rules, first line @AGENTS.md, then plan mode and slash commands</text><rect x="60" y="410" width="1080" height="82" rx="10" fill="#fff" stroke="#d8d6cf"/><rect x="60" y="410" width="10" height="82" rx="4" fill="#1d4e89"/><text x="90" y="446" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111110">AGENTS.md (in the repo)</text><text x="90" y="474" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#4a4a45">Build, test and style rules. Read by Codex, Cursor, Copilot, and Claude Code via the import</text><rect x="60" y="510" width="1080" height="82" rx="10" fill="#fff" stroke="#d8d6cf"/><rect x="60" y="510" width="10" height="82" rx="4" fill="#8a1f2d"/><text x="90" y="546" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#111110">Hook or permission setting</text><text x="90" y="574" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#4a4a45">Rules that must never be broken. Enforced, not requested</text></svg>

    </pattern>

    <linearGradient id="flow1" gradientUnits="userSpaceOnUse" x1="0" y1="-220" x2="220" y2="0">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#111110" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="flow2" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="0" y2="220">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.15"/>

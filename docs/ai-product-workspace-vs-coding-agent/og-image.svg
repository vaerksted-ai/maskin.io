<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#111110" stroke-width="2.2"/>
    </pattern>
    <marker id="ah-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111110"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111110" fill-opacity="0.5"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#F0EDE7"/>

  <g stroke="#111110" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
  </g>

  <text x="72" y="88" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#111110" fill-opacity="0.55" letter-spacing="0.02em">MASKIN &#183; POSITIONING</text>

  <text x="72" y="180" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#111110">AI product workspace</text>
  <text x="72" y="248" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="500" fill="#111110" fill-opacity="0.72">vs AI coding agent</text>

  <text x="72" y="330" font-family="'Newsreader', Georgia, serif" font-size="26" font-style="italic" fill="#111110" fill-opacity="0.78">Different tiers. Both agentic. Most teams run both.</text>

  <!-- Left tier: coding agent -->
  <g transform="translate(90 400)">
    <rect x="0" y="0" width="460" height="170" rx="14" fill="#FAFAF8" stroke="#111110" stroke-width="3"/>
    <text x="24" y="42" font-family="'JetBrains Mono', monospace" font-size="18" fill="#111110" fill-opacity="0.6" letter-spacing="0.06em">AI CODING AGENT</text>
    <text x="24" y="80" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#111110">object of work &rarr; coding task</text>
    <text x="24" y="118" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#111110">terminal event &rarr; PR merged</text>
    <text x="24" y="152" font-family="'Newsreader', Georgia, serif" font-size="20" font-style="italic" fill="#111110" fill-opacity="0.7">Claude Code, Codex, Cursor</text>
  </g>

  <!-- Right tier: product workspace -->
  <g transform="translate(650 400)">
    <rect x="0" y="0" width="460" height="170" rx="14" fill="#111110"/>
    <text x="24" y="42" font-family="'JetBrains Mono', monospace" font-size="18" fill="#FAFAF8" fill-opacity="0.7" letter-spacing="0.06em">AI PRODUCT WORKSPACE</text>
    <text x="24" y="80" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#FAFAF8">object of work &rarr; shaped bet</text>
    <text x="24" y="118" font-family="'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#2563EB">terminal event &rarr; validated outcome</text>
    <text x="24" y="152" font-family="'Newsreader', Georgia, serif" font-size="20" font-style="italic" fill="#FAFAF8" fill-opacity="0.7">Maskin, open source, MCP-native</text>
  </g>

  <!-- Arrow indicating tier relationship -->
  <g transform="translate(600 485)">
    <path d="M -40 0 L 40 0" stroke="#111110" stroke-opacity="0.35" stroke-width="3" marker-end="url(#ah-muted)" marker-start="url(#ah-muted)"/>
  </g>

  <g fill="#111110" fill-opacity="0.14">
    <circle cx="1100" cy="120" r="3"/>
    <circle cx="1140" cy="180" r="2"/>
    <circle cx="60" cy="580" r="3"/>
    <circle cx="1120" cy="600" r="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#111110" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#topFade)"/>
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="22" fill="#5A5751" letter-spacing="4">AGENTIC LOOPS FOR KNOWLEDGE WORKERS</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">Coders get a compiler.</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">You write the finish line.</text>
  <text x="80" y="266" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" fill="#8B8781">How an agent loop proves it did the job right</text>
  <g>
    <rect x="80" y="322" width="1040" height="44" rx="11" fill="#141311" stroke="#3A3835" stroke-width="1.4"/>
    <text x="102" y="350" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#D6D3CC">1 · close condition · a checkable definition of done, written before the work</text>
    <rect x="80" y="378" width="1040" height="44" rx="11" fill="#141311" stroke="#3A3835" stroke-width="1.4"/>
    <text x="102" y="406" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#D6D3CC">2 · recorded verdict · pass or fail against it, stored with the work</text>
    <rect x="75" y="434" width="1050" height="54" rx="14" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.28"/>
    <rect x="80" y="439" width="1040" height="44" rx="11" fill="#131720" stroke="#2563EB" stroke-width="2"/>
    <text x="102" y="467" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#FAFAF8">3 · human gate · a person approves the outcome</text>
  </g>
  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="#1C1B18"/>
    <path d="M7 26 L7 9 L17 19 L27 9 L27 26" stroke="#FAFAF8" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <text x="46" y="24" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">Maskin</text>
    <text x="46" y="46" font-family="JetBrains Mono, monospace" font-size="12" fill="#5A5751">maskin.io/docs/learn/agentic-loops-for-knowledge-workers</text>
  </g>
</svg>

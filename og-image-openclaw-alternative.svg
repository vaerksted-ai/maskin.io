<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f13" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d0f13" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d0f13"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#topFade)"/>
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="22" fill="#8a93a0" letter-spacing="4">OPENCLAW ALTERNATIVE</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e8eaee">Which OpenClaw alternative?</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e8eaee">Depends on what is missing.</text>
  <text x="80" y="266" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" fill="#8a93a0">One agent, a lighter runtime, hosted, or a shared team record</text>
  <g>
    <rect x="80" y="322" width="1040" height="44" rx="11" fill="#12151a" stroke="#373d47" stroke-width="1.4"/>
    <text x="102" y="350" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#c9ced6">personal agent · Hermes, NanoClaw, ZeroClaw</text>
    <text x="1100" y="350" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#8a93a0">memory or lighter</text>
    <rect x="75" y="382" width="1050" height="54" rx="14" fill="none" stroke="#6a8cff" stroke-width="1" opacity="0.28"/>
    <rect x="80" y="387" width="1040" height="44" rx="11" fill="#12151a" stroke="#6a8cff" stroke-width="2"/>
    <text x="102" y="415" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#e8eaee">team workspace · shared record of decisions and outcomes</text>
    <text x="1100" y="415" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#a9bcff">Maskin</text>
  </g>
  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="34" height="34" rx="7" fill="#12151a"/>
    <path d="M7 26 L7 9 L17 19 L27 9 L27 26" stroke="#e8eaee" stroke-width="3.6" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    <text x="46" y="24" font-family="Schibsted Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#e8eaee">Maskin</text>
    <text x="46" y="46" font-family="JetBrains Mono, monospace" font-size="12" fill="#8a93a0">maskin.io/alternatives/openclaw</text>
  </g>
</svg>

    <line x1="170" y1="490" x2="290" y2="490" stroke="#3A3835" stroke-width="1.4"/>
    <line x1="360" y1="490" x2="460" y2="490" stroke="#3A3835" stroke-width="1.4"/>
    <line x1="510" y1="490" x2="590" y2="490" stroke="#2563EB" stroke-width="2.4"/>
    <line x1="670" y1="490" x2="770" y2="490" stroke="#2563EB" stroke-width="2.4"/>
    <line x1="810" y1="490" x2="900" y2="490" stroke="#3A3835" stroke-width="1.4"/>
    <line x1="960" y1="490" x2="1050" y2="490" stroke="#3A3835" stroke-width="1.4"/>

    <circle cx="130" cy="490" r="22" fill="#111110" stroke="#FAFAF8" stroke-width="2"/>
    <circle cx="130" cy="490" r="6" fill="#FAFAF8"/>

    <rect x="288" y="470" width="52" height="42" rx="8" fill="#111110" stroke="#FAFAF8" stroke-width="2"/>
    <line x1="298" y1="482" x2="330" y2="482" stroke="#FAFAF8" stroke-width="1.2" opacity="0.6"/>
    <line x1="298" y1="492" x2="326" y2="492" stroke="#FAFAF8" stroke-width="1.2" opacity="0.6"/>
    <line x1="298" y1="502" x2="330" y2="502" stroke="#FAFAF8" stroke-width="1.2" opacity="0.6"/>

    <rect x="458" y="474" width="34" height="32" fill="#FAFAF8"/>

    <rect x="580" y="464" width="76" height="54" rx="10" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.28"/>
    <rect x="590" y="470" width="60" height="42" rx="8" fill="#111110" stroke="#2563EB" stroke-width="2.4"/>
    <line x1="600" y1="482" x2="640" y2="482" stroke="#2563EB" stroke-width="1.6" opacity="0.85"/>
    <line x1="600" y1="492" x2="634" y2="492" stroke="#2563EB" stroke-width="1.6" opacity="0.85"/>
    <line x1="600" y1="502" x2="640" y2="502" stroke="#2563EB" stroke-width="1.6" opacity="0.85"/>

    <rect x="770" y="474" width="36" height="32" fill="none" stroke="#2563EB" stroke-width="2.4"/>

    <circle cx="925" cy="490" r="18" fill="#111110" stroke="#FAFAF8" stroke-width="2"/>
    <circle cx="925" cy="490" r="5" fill="#FAFAF8"/>

    <polygon points="1075,468 1105,485 1105,515 1075,532 1045,515 1045,485"

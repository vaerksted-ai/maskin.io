    <rect x="80"  y="300" width="140" height="20" rx="4" fill="#181715" stroke="#7A7770" stroke-width="1.2"/>
    <text x="90"  y="315" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#B8B5AE">enter · state</text>
    <rect x="240" y="300" width="130" height="20" rx="4" fill="#181715" stroke="#7A7770" stroke-width="1.2"/>
    <text x="250" y="315" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#B8B5AE">model.call</text>
    <rect x="390" y="300" width="120" height="20" rx="4" fill="#181715" stroke="#7A7770" stroke-width="1.2"/>
    <text x="400" y="315" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#B8B5AE">tool.call</text>
    <rect x="530" y="292" width="160" height="36" rx="6" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.28"/>
    <rect x="540" y="298" width="140" height="24" rx="4" fill="#181715" stroke="#2563EB" stroke-width="2"/>
    <text x="552" y="315" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#FAFAF8">decision · gate</text>
    <rect x="700" y="300" width="120" height="20" rx="4" fill="#181715" stroke="#7A7770" stroke-width="1.2"/>
    <text x="710" y="315" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#B8B5AE">tool.call</text>
    <rect x="840" y="300" width="140" height="20" rx="4" fill="#181715" stroke="#7A7770" stroke-width="1.2"/>
    <text x="850" y="315" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#B8B5AE">eval · score</text>
    <rect x="1000" y="300" width="120" height="20" rx="4" fill="#181715" stroke="#7A7770" stroke-width="1.2"/>
    <text x="1010" y="315" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#B8B5AE">exit · state</text>
  </g>

  <g transform="translate(600, 380)">

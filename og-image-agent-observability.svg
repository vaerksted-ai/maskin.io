<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#111110" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111110" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glowStripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="anchorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#topFade)"/>
  <rect width="1200" height="180" y="450" fill="url(#bottomFade)"/>

  <!-- Eyebrow label -->
  <text x="80" y="88" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#8A8780">AGENT&#160;OBSERVABILITY</text>

  <!-- Title (Newsreader-ish serif via generic fallback) -->
  <text x="80" y="168" font-family="'Newsreader', 'Times New Roman', serif" font-size="60" font-weight="500" fill="#FAFAF8">When the workspace</text>
  <text x="80" y="228" font-family="'Newsreader', 'Times New Roman', serif" font-size="60" font-style="italic" font-weight="400" fill="#FAFAF8">is</text>
  <text x="150" y="228" font-family="'Newsreader', 'Times New Roman', serif" font-size="60" font-weight="500" fill="#FAFAF8">the trace.</text>

  <g id="trace">

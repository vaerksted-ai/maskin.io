  <text x="80" y="270" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="3" fill="#8A8780">TRACE&#160;·&#160;WHAT&#160;THE&#160;AGENT&#160;DID</text>
  <text x="80" y="440" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="3" fill="#8A8780">SUBSTRATE&#160;·&#160;WHERE&#160;THE&#160;WORK&#160;LIVES</text>

  <text x="80" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#8A8780">maskin.io/docs/agent-observability/</text>

  <g transform="translate(1120, 555)">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="#1C1B18"/>
    <path d="M9 33 L9 11 L22 25 L35 11 L35 33"
          stroke="#FAFAF8" stroke-width="4.5"
          stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  </g>
</svg>

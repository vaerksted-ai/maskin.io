name: temp flow listing copy

# One-use helper for the "a human gates the taste-sensitive parts" copy fix.
# Runs the clause replacement and the twin regeneration on the branch, verifies, commits.
# Deleted from the branch once the change is committed; it must never reach main.
# Triggered by a push to this one branch, because workflow_dispatch needs the file on main.

on:
  push:
    branches:
      - pmm/value-frame-flow-block

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Replace the approval clause in the shared block
        run: |
          set -e
          files=$(grep -rl "a human gates the taste-sensitive parts" marketplace/*/index.html solutions/*/index.html)
          count=$(printf "%s\n" "$files" | grep -c "index.html")
          echo "files matched: $count"
          echo "$files"
          if [ "$count" = "0" ]; then
            echo "clause already replaced, nothing to do"
            exit 0
          fi
          test "$count" = "8"
          for f in $files; do
            sed -i 's/a human gates the taste-sensitive parts/each is accountable for its own job/g' "$f"
          done
      - name: Regenerate md twins and llms-full
        run: python3 -I scripts_gen_md.py
      - name: Show the change
        run: git diff --stat
      - name: Tests
        run: node --test
      - name: Build
        run: bash build.sh
      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace solutions llms-full.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Flow listings: rewrite the shared approval line in the value frame" \
            -m "The \"What this flow is built with\" block said \"a human gates the taste-sensitive parts\", which sells approval as the product's value and breaks the 24 Nov wording rule. It is replaced with \"each is accountable for its own job\", so the line says what the digital employees own, not what a person signs off." \
            -m "Applied to the seven flow listings that carry the block and to the same block on /solutions/product-teams/. Markdown twins and llms-full.txt regenerated with scripts_gen_md.py, not by hand." \
            -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push

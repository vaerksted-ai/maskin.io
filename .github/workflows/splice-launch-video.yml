name: Splice launch video

# Manual, plus a push trigger on the task branch only (workflow_dispatch is not
# available for a workflow file that is not on main yet). Probe step: prints tool
# versions so we know the runner can do the v2 sidebar splice (Playwright record +
# ffmpeg re-encode). The real splice steps are added once the v2 mock page is committed.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/task-79815e5c-splice-v2-sidebar
    paths:
      - .github/workflows/splice-launch-video.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg and ffprobe versions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Playwright version
        run: npx --yes playwright@1 --version
      - name: Inspect v1 video
        run: |
          ls -l maskin-launch.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt:format=duration,size -of default=nw=1 maskin-launch.mp4

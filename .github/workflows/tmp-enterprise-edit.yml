name: Tmp enterprise edit
on:
  push:
    branches: [docs/security-microvm-isolation]
    paths: ['.github/workflows/tmp-enterprise-edit.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit
        run: |
          sed -i 's|<li>SSO &amp; RBAC</li>|<li>SSO \&amp; fine-grained access control (planned)</li>|' index.html
          git diff --stat
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo none; exit 1; }
          git commit -m "Enterprise card: mark SSO and fine-grained access control as planned"
          git push

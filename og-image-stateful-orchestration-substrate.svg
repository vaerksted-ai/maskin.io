<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <linearGradient id="substrateFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111110" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0C0C0B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="substrateGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#111110" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="anchorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm-dark canvas + subtle grid -->
  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="120" fill="url(#topFade)"/>

  <!-- ================================================================ -->
  <!-- AGENTS: stateless boxes with dashed handoff arcs between them    -->
  <!-- Dashed border = ephemeral context. Each box carries a fresh,     -->
  <!-- isolated context that evaporates on return.                       -->
  <!-- ================================================================ -->
  <g id="agents">
    <!-- Handoff arcs between consecutive agents (dashed = lossy) -->
    <g fill="none" stroke="#5A5751" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.75">
      <path d="M 240 120 Q 265 78, 290 120"/>
      <path d="M 430 120 Q 455 78, 480 120"/>
      <path d="M 630 108 Q 655 62, 680 108"/>
      <path d="M 820 120 Q 845 78, 870 120"/>
    </g>
    <g fill="#5A5751" opacity="0.75">
      <path d="M 290 122 l -6 -3 l 0 6 z"/>
      <path d="M 480 122 l -6 -3 l 0 6 z"/>
      <path d="M 680 110 l -6 -3 l 0 6 z"/>
      <path d="M 870 122 l -6 -3 l 0 6 z"/>
    </g>

    <!-- Agent 1 -->
    <rect x="100" y="120" width="140" height="90" rx="6" fill="#181715" stroke="#7A7770" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="118" y1="146" x2="196" y2="146" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="118" y1="163" x2="176" y2="163" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="118" y1="180" x2="188" y2="180" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>

    <!-- Agent 2 -->
    <rect x="290" y="120" width="140" height="90" rx="6" fill="#181715" stroke="#7A7770" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="308" y1="146" x2="386" y2="146" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="308" y1="163" x2="368" y2="163" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="308" y1="180" x2="378" y2="180" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>

    <!-- Agent 3 -->
    <rect x="480" y="120" width="140" height="90" rx="6" fill="#181715" stroke="#7A7770" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="498" y1="146" x2="576" y2="146" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="498" y1="163" x2="558" y2="163" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="498" y1="180" x2="568" y2="180" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>

    <!-- Agent 4 (LIVE / accent — currently reading + writing) -->
    <rect x="670" y="102" width="160" height="126" rx="10" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.28"/>
    <rect x="680" y="110" width="140" height="110" rx="6" fill="#181715" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="698" y1="138" x2="796" y2="138" stroke="#2563EB" stroke-width="1.7" opacity="0.85"/>
    <line x1="698" y1="158" x2="768" y2="158" stroke="#2563EB" stroke-width="1.7" opacity="0.85"/>
    <line x1="698" y1="178" x2="782" y2="178" stroke="#2563EB" stroke-width="1.7" opacity="0.85"/>
    <line x1="698" y1="198" x2="750" y2="198" stroke="#2563EB" stroke-width="1.7" opacity="0.85"/>

    <!-- Agent 5 -->
    <rect x="870" y="120" width="140" height="90" rx="6" fill="#181715" stroke="#7A7770" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="888" y1="146" x2="966" y2="146" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="888" y1="163" x2="948" y2="163" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
    <line x1="888" y1="180" x2="958" y2="180" stroke="#8A8780" stroke-width="1.4" opacity="0.55"/>
  </g>

  <!-- ================================================================ -->
  <!-- READ / WRITE CHANNELS: each agent plugs into the substrate.      -->
  <!-- Left column (dashed, up) = read; right column (solid, down) =    -->
  <!-- write. The live agent's channel is accent-blue.                  -->
  <!-- ================================================================ -->
  <g id="rw-channels">
    <!-- Agent 1 -->
    <line x1="158" y1="212" x2="158" y2="370" stroke="#5A5751" stroke-width="0.9" stroke-dasharray="2 5"/>
    <line x1="182" y1="212" x2="182" y2="370" stroke="#7A7770" stroke-width="1.2"/>
    <path d="M 182 372 l -4.5 -9 l 9 0 z" fill="#7A7770"/>

    <!-- Agent 2 -->
    <line x1="348" y1="212" x2="348" y2="370" stroke="#5A5751" stroke-width="0.9" stroke-dasharray="2 5"/>
    <line x1="372" y1="212" x2="372" y2="370" stroke="#7A7770" stroke-width="1.2"/>
    <path d="M 372 372 l -4.5 -9 l 9 0 z" fill="#7A7770"/>

    <!-- Agent 3 -->
    <line x1="538" y1="212" x2="538" y2="370" stroke="#5A5751" stroke-width="0.9" stroke-dasharray="2 5"/>
    <line x1="562" y1="212" x2="562" y2="370" stroke="#7A7770" stroke-width="1.2"/>
    <path d="M 562 372 l -4.5 -9 l 9 0 z" fill="#7A7770"/>

    <!-- Agent 4 (LIVE) — write channel accent, read channel accent -->
    <line x1="728" y1="222" x2="728" y2="370" stroke="#2563EB" stroke-width="1.1" stroke-dasharray="2 5" opacity="0.85"/>
    <line x1="752" y1="222" x2="752" y2="370" stroke="#2563EB" stroke-width="2"/>
    <path d="M 752 373 l -6 -11 l 12 0 z" fill="#2563EB"/>

    <!-- Agent 5 -->
    <line x1="928" y1="212" x2="928" y2="370" stroke="#5A5751" stroke-width="0.9" stroke-dasharray="2 5"/>
    <line x1="952" y1="212" x2="952" y2="370" stroke="#7A7770" stroke-width="1.2"/>
    <path d="M 952 372 l -4.5 -9 l 9 0 z" fill="#7A7770"/>
  </g>

  <!-- ================================================================ -->
  <!-- SUBSTRATE: shared plane below carrying typed state.              -->
  <!-- Horizon + perspective grid, accent glow, anchor plug-points.      -->
  <!-- ================================================================ -->
  <g id="substrate">
    <!-- horizon (top edge of substrate) -->
    <line x1="0" y1="370" x2="1200" y2="370" stroke="#3A3835" stroke-width="1.2"/>
    <line x1="0" y1="370" x2="1200" y2="370" stroke="#2563EB" stroke-width="0.7" opacity="0.28"/>

    <!-- perspective rays from vanishing point (600, 370) -->
    <g stroke="#2A2825" stroke-width="0.7" fill="none">
      <line x1="600" y1="370" x2="-500" y2="630"/>
      <line x1="600" y1="370" x2="-200" y2="630"/>
      <line x1="600" y1="370" x2="60" y2="630"/>
      <line x1="600" y1="370" x2="230" y2="630"/>
      <line x1="600" y1="370" x2="360" y2="630"/>
      <line x1="600" y1="370" x2="460" y2="630"/>
      <line x1="600" y1="370" x2="540" y2="630"/>
    </g>
    <line x1="600" y1="370" x2="600" y2="630" stroke="#2E2C28" stroke-width="0.9" fill="none"/>
    <g stroke="#2A2825" stroke-width="0.7" fill="none">
      <line x1="600" y1="370" x2="660" y2="630"/>
      <line x1="600" y1="370" x2="740" y2="630"/>
      <line x1="600" y1="370" x2="840" y2="630"/>
      <line x1="600" y1="370" x2="970" y2="630"/>
      <line x1="600" y1="370" x2="1140" y2="630"/>
      <line x1="600" y1="370" x2="1400" y2="630"/>
      <line x1="600" y1="370" x2="1700" y2="630"/>
    </g>

    <!-- receding horizontal lines -->
    <line x1="0" y1="388" x2="1200" y2="388" stroke="#26241F" stroke-width="0.55"/>
    <line x1="0" y1="410" x2="1200" y2="410" stroke="#292724" stroke-width="0.65"/>
    <line x1="0" y1="438" x2="1200" y2="438" stroke="#2D2B27" stroke-width="0.75"/>
    <line x1="0" y1="472" x2="1200" y2="472" stroke="#312F2B" stroke-width="0.9"/>
    <line x1="0" y1="516" x2="1200" y2="516" stroke="#37342F" stroke-width="1.0"/>
    <line x1="0" y1="570" x2="1200" y2="570" stroke="#3D3B36" stroke-width="1.15"/>

    <!-- lattice endpoint dots — anonymous state cells -->
    <g fill="#3A3835">
      <circle cx="80"  cy="410" r="1.2"/>
      <circle cx="220" cy="410" r="1.2"/>
      <circle cx="360" cy="410" r="1.2"/>
      <circle cx="480" cy="410" r="1.2"/>
      <circle cx="1080" cy="410" r="1.2"/>
      <circle cx="1150" cy="410" r="1.2"/>

      <circle cx="60"  cy="438" r="1.4"/>
      <circle cx="200" cy="438" r="1.4"/>
      <circle cx="340" cy="438" r="1.4"/>
      <circle cx="440" cy="438" r="1.4"/>
      <circle cx="1050" cy="438" r="1.4"/>
      <circle cx="1140" cy="438" r="1.4"/>

      <circle cx="40"  cy="472" r="1.6"/>
      <circle cx="180" cy="472" r="1.6"/>
      <circle cx="320" cy="472" r="1.6"/>
      <circle cx="1060" cy="472" r="1.6"/>

      <circle cx="20"  cy="516" r="1.9"/>
      <circle cx="200" cy="516" r="1.9"/>
      <circle cx="1000" cy="516" r="1.9"/>
      <circle cx="1170" cy="516" r="1.9"/>

      <circle cx="80"  cy="570" r="2.3"/>
      <circle cx="270" cy="570" r="2.3"/>
      <circle cx="920" cy="570" r="2.3"/>
      <circle cx="1120" cy="570" r="2.3"/>
    </g>

    <!-- substrate depth glow + fade to bottom -->
    <rect x="0" y="370" width="1200" height="200" fill="url(#substrateGlow)"/>
    <rect x="0" y="440" width="1200" height="190" fill="url(#substrateFade)"/>

    <!-- Anchor plug points on the horizon where each agent's channel lands -->
    <g fill="#FAFAF8">
      <circle cx="170" cy="370" r="2.4"/>
      <circle cx="360" cy="370" r="2.4"/>
      <circle cx="550" cy="370" r="2.4"/>
      <circle cx="940" cy="370" r="2.4"/>
    </g>
    <!-- accent live anchor -->
    <circle cx="740" cy="370" r="16" fill="url(#anchorGlow)"/>
    <circle cx="740" cy="370" r="3.4" fill="#2563EB"/>
    <circle cx="740" cy="370" r="7.5" fill="none" stroke="#2563EB" stroke-width="0.9" opacity="0.55"/>
  </g>

  <!-- ================================================================ -->
  <!-- TYPED NODES ON THE SUBSTRATE — the state the agents don't hold.  -->
  <!-- Vocabulary matches the workspace: circle=insight, rounded-rect=  -->
  <!-- bet, square=task, hexagon=loop.                                   -->
  <!-- ================================================================ -->
  <g id="typed-graph">
    <!-- Edges (typed relationships) drawn beneath nodes -->
    <line x1="185" y1="472" x2="308" y2="490" stroke="#3A3835" stroke-width="1.4"/>
    <line x1="356" y1="482" x2="470" y2="464" stroke="#3A3835" stroke-width="1.4"/>
    <line x1="512" y1="464" x2="588" y2="462" stroke="#2563EB" stroke-width="2.4"/>
    <line x1="646" y1="462" x2="746" y2="470" stroke="#2563EB" stroke-width="2.4"/>
    <line x1="782" y1="472" x2="880" y2="466" stroke="#3A3835" stroke-width="1.4"/>
    <line x1="900" y1="464" x2="985" y2="452" stroke="#2563EB" stroke-width="2.4"/>
    <line x1="466" y1="486" x2="530" y2="546" stroke="#3A3835" stroke-width="1.4"/>

    <!-- Insight (outlined circle + core dot) -->
    <circle cx="180" cy="470" r="26" fill="#111110" stroke="#FAFAF8" stroke-width="2"/>
    <circle cx="180" cy="470" r="7" fill="#FAFAF8"/>

    <!-- Bet (rounded rect + 3 ticks) -->
    <rect x="304" y="466" width="54" height="46" rx="9" fill="#111110" stroke="#FAFAF8" stroke-width="2"/>
    <line x1="313" y1="478" x2="349" y2="478" stroke="#FAFAF8" stroke-width="1.4" opacity="0.6"/>
    <line x1="313" y1="489" x2="343" y2="489" stroke="#FAFAF8" stroke-width="1.4" opacity="0.6"/>
    <line x1="313" y1="500" x2="349" y2="500" stroke="#FAFAF8" stroke-width="1.4" opacity="0.6"/>

    <!-- Task (solid square) -->
    <rect x="470" y="446" width="42" height="34" fill="#FAFAF8"/>

    <!-- Bet-LIVE (accent, halo, thick outline) -->
    <rect x="576" y="440" width="72" height="56" rx="10" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.28"/>
    <rect x="586" y="448" width="56" height="40" rx="8" fill="#111110" stroke="#2563EB" stroke-width="2.4"/>
    <line x1="596" y1="459" x2="632" y2="459" stroke="#2563EB" stroke-width="1.6" opacity="0.8"/>
    <line x1="596" y1="469" x2="626" y2="469" stroke="#2563EB" stroke-width="1.6" opacity="0.8"/>
    <line x1="596" y1="479" x2="632" y2="479" stroke="#2563EB" stroke-width="1.6" opacity="0.8"/>

    <!-- Task-LIVE (accent outlined square) -->
    <rect x="708" y="450" width="42" height="36" fill="none" stroke="#2563EB" stroke-width="2.4"/>

    <!-- Insight (small satellite) -->
    <circle cx="882" cy="466" r="16" fill="#111110" stroke="#FAFAF8" stroke-width="2"/>
    <circle cx="882" cy="466" r="5" fill="#FAFAF8"/>

    <!-- Loop (hexagon + core dot) -->
    <polygon points="1000,420 1034,440 1034,478 1000,498 966,478 966,440"
             fill="#111110" stroke="#FAFAF8" stroke-width="2"/>
    <circle cx="1000" cy="459" r="7" fill="#FAFAF8"/>

    <!-- Side task (outlined square, further into perspective — deeper state) -->
    <rect x="514" y="546" width="30" height="26" fill="none" stroke="#FAFAF8" stroke-width="1.8" opacity="0.7"/>
  </g>

  <!-- Signature: Maskin M mark, bottom-right -->
  <g transform="translate(1120, 555)">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="#1C1B18"/>
    <path d="M9 33 L9 11 L22 25 L35 11 L35 33"
          stroke="#FAFAF8" stroke-width="4.5"
          stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">AI-native product operating model: the signal, evidence and continuity gaps</title>
  <desc id="d">Three boxes in a row. Signal: does customer reality reach the decision. Evidence: can a new idea be compared with a roadmap bet. Continuity: does the reason survive each handoff. Each box carries the test a team can run this week.</desc>
  <defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.05"/></pattern></defs>
  <rect width="1200" height="630" fill="#111110"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <text x="80" y="98" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="22" fill="#5A5751" letter-spacing="4">AI-NATIVE PRODUCT OPERATING MODEL</text>
  <text x="80" y="160" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">Three gaps between</text>
  <text x="80" y="222" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#FAFAF8">a customer and a decision.</text>
  <text x="80" y="266" font-family="Newsreader, Georgia, serif" font-size="24" font-style="italic" fill="#8B8781">Each one has a test you can run on a current bet this week.</text>
  <g id="diagram">
    <rect x="80" y="322" width="320" height="220" rx="14" fill="#141311" stroke="#3A3835" stroke-width="1.4"/>
    <text x="106" y="360" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781" letter-spacing="2">SIGNAL</text>
    <text x="106" y="406" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">Does customer reality</text>
    <text x="106" y="434" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">reach the decision?</text>
    <text x="106" y="486" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">Test: name the customer</text>
    <text x="106" y="508" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">signals behind one bet.</text>
    <path d="M400 432 L440 432" fill="none" stroke="#2563EB" stroke-width="2.4"/>
    <path d="M428 424 L442 432 L428 440" fill="none" stroke="#2563EB" stroke-width="2.4"/>
    <rect x="440" y="322" width="320" height="220" rx="14" fill="#141311" stroke="#3A3835" stroke-width="1.4"/>
    <text x="466" y="360" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781" letter-spacing="2">EVIDENCE</text>
    <text x="466" y="406" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">Can a new idea be compared</text>
    <text x="466" y="434" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">with a roadmap bet?</text>
    <text x="466" y="486" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">Test: put both side by side</text>
    <text x="466" y="508" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">on problem, evidence, outcome.</text>
    <path d="M760 432 L800 432" fill="none" stroke="#2563EB" stroke-width="2.4"/>
    <path d="M788 424 L802 432 L788 440" fill="none" stroke="#2563EB" stroke-width="2.4"/>
    <rect x="800" y="322" width="320" height="220" rx="14" fill="#131720" stroke="#2563EB" stroke-width="2"/>
    <text x="826" y="360" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#7FA6EE" letter-spacing="2">CONTINUITY</text>
    <text x="826" y="406" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">Does the reason survive</text>
    <text x="826" y="434" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FAFAF8">each handoff?</text>
    <text x="826" y="486" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">Test: trace the last shipped</text>
    <text x="826" y="508" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B8781">feature to evidence in 15 min.</text>
  </g>
  <text x="80" y="590" font-family="Schibsted Grotesk, Inter, system-ui, sans-serif" font-size="18" fill="#5A5751" letter-spacing="3">MASKIN.IO</text>
</svg>
